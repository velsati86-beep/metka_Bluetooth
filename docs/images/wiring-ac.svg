<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660"><rect width="980" height="660" fill="#ffffff"/><text x="490.0" y="28" font-size="20" text-anchor="middle" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="bold">Схема 3. Замок на переменном токе и твердотельное реле SSR-25DA</text><rect x="50" y="50" width="170" height="120" rx="8" fill="#f4f6fa" stroke="#445" stroke-width="2"/><text x="135.0" y="72" font-size="14" text-anchor="middle" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="bold">Блок питания 5 В</text><text x="135.0" y="90" font-size="11" text-anchor="middle" fill="#666" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">для ESP32 (отдельный)</text><circle cx="220" cy="112" r="4.5" fill="#fff" stroke="#ef8a00" stroke-width="2"/><text x="211" y="116" font-size="12" text-anchor="end" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">+5 В</text><circle cx="220" cy="142" r="4.5" fill="#fff" stroke="#222222" stroke-width="2"/><text x="211" y="146" font-size="12" text-anchor="end" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">GND</text><rect x="300" y="50" width="190" height="190" rx="8" fill="#f4f6fa" stroke="#445" stroke-width="2"/><text x="395.0" y="72" font-size="14" text-anchor="middle" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="bold">ESP32</text><text x="395.0" y="90" font-size="11" text-anchor="middle" fill="#666" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">ESP32 Dev Module</text><circle cx="300" cy="112" r="4.5" fill="#fff" stroke="#ef8a00" stroke-width="2"/><text x="309" y="116" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">VIN (5 В)</text><circle cx="300" cy="142" r="4.5" fill="#fff" stroke="#222222" stroke-width="2"/><text x="309" y="146" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">GND</text><circle cx="490" cy="112" r="4.5" fill="#fff" stroke="#1e6fd9" stroke-width="2"/><text x="481" y="116" font-size="12" text-anchor="end" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">GPIO26</text><circle cx="490" cy="142" r="4.5" fill="#fff" stroke="#222222" stroke-width="2"/><text x="481" y="146" font-size="12" text-anchor="end" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">GND</text><rect x="600" y="50" width="190" height="140" rx="8" fill="#f4f6fa" stroke="#445" stroke-width="2"/><text x="695.0" y="72" font-size="14" text-anchor="middle" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="bold">SSR-25DA</text><text x="695.0" y="90" font-size="11" text-anchor="middle" fill="#666" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">вход 3–32 В постоянного тока</text><circle cx="600" cy="112" r="4.5" fill="#fff" stroke="#1e6fd9" stroke-width="2"/><text x="609" y="116" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">3 (+)</text><circle cx="600" cy="142" r="4.5" fill="#fff" stroke="#222222" stroke-width="2"/><text x="609" y="146" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">4 (−)</text><circle cx="640" cy="190" r="4.5" fill="#fff" stroke="#b5442a" stroke-width="2"/><text x="648" y="208" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">1</text><circle cx="750" cy="190" r="4.5" fill="#fff" stroke="#b5442a" stroke-width="2"/><text x="758" y="208" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">2</text><text x="695" y="232" font-size="10" text-anchor="middle" fill="#666" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">силовая часть</text><polyline points="220,112 300,112" fill="none" stroke="#ef8a00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="220,142 300,142" fill="none" stroke="#222222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="490,112 600,112" fill="none" stroke="#1e6fd9" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="490,142 600,142" fill="none" stroke="#222222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="50" y="330" width="190" height="140" rx="8" fill="#f4f6fa" stroke="#445" stroke-width="2"/><text x="145.0" y="352" font-size="14" text-anchor="middle" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="bold">Питание замка</text><text x="145.0" y="370" font-size="11" text-anchor="middle" fill="#666" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">переменный ток (AC)</text><circle cx="240" cy="395" r="4.5" fill="#fff" stroke="#b5442a" stroke-width="2"/><text x="231" y="399" font-size="12" text-anchor="end" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">L (фаза)</text><circle cx="240" cy="435" r="4.5" fill="#fff" stroke="#355c7d" stroke-width="2"/><text x="231" y="439" font-size="12" text-anchor="end" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">N (ноль)</text><rect x="800" y="330" width="150" height="130" rx="8" fill="#f4f6fa" stroke="#445" stroke-width="2"/><text x="875.0" y="352" font-size="14" text-anchor="middle" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="bold">Электрозамок</text><text x="875.0" y="370" font-size="11" text-anchor="middle" fill="#666" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">переменный ток</text><circle cx="800" cy="395" r="4.5" fill="#fff" stroke="#b5442a" stroke-width="2"/><text x="809" y="399" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">A</text><circle cx="800" cy="435" r="4.5" fill="#fff" stroke="#355c7d" stroke-width="2"/><text x="809" y="439" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">B</text><polyline points="240,395 640,395 640,190" fill="none" stroke="#b5442a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="314" y="387" width="32" height="16" rx="3" fill="#fff" stroke="#222222" stroke-width="2"/><line x1="314" y1="395" x2="346" y2="395" stroke="#222222" stroke-width="2"/><text x="330" y="381" font-size="11" text-anchor="middle" fill="#444" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">предохранитель</text><polyline points="750,190 750,395 800,395" fill="none" stroke="#b5442a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="800,435 770,435 770,495 270,495 270,435 240,435" fill="none" stroke="#355c7d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="60,540 88,540" fill="none" stroke="#ef8a00" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="98" y="544" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">+5 В (слаботочная часть)</text><polyline points="60,560 88,560" fill="none" stroke="#1e6fd9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="98" y="564" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">сигнал GPIO26</text><polyline points="60,580 88,580" fill="none" stroke="#222222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="98" y="584" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">GND</text><polyline points="60,600 88,600" fill="none" stroke="#b5442a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="98" y="604" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">фаза / сила (опасно)</text><polyline points="60,620 88,620" fill="none" stroke="#355c7d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="98" y="624" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">ноль (опасно)</text><rect x="380" y="520" width="570" height="120" rx="8" fill="#fff4f4" stroke="#d32f2f" stroke-width="2"/><text x="394" y="542" font-size="13" text-anchor="start" fill="#d32f2f" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="bold">Опасное напряжение</text><text x="394" y="562" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Работы с сетью выполняйте при отключённом питании и только если умеете.</text><text x="394" y="580" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Провода сечением по току замка, соединения изолируйте, ставьте предохранитель.</text><text x="394" y="598" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">SSR-25DA коммутирует только переменный ток. Для замка на постоянном токе</text><text x="394" y="616" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">берите схему 2. Вход SSR рассчитан на 3–32 В; от 3,3 В с GPIO обычно</text><text x="394" y="634" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">срабатывает, но на вашей плате это нужно проверить.</text></svg>