<svg xmlns="http://www.w3.org/2000/svg" width="940" height="720" viewBox="0 0 940 720"><rect width="940" height="720" fill="#ffffff"/><text x="470.0" y="28" font-size="20" text-anchor="middle" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="bold">Схема 1. Что куда подключать на плате ESP32</text><text x="470" y="50" font-size="13" text-anchor="middle" fill="#555" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Вид сверху: антенна сверху, разъём USB снизу (30-контактная плата ESP32 DevKit)</text><rect x="350" y="70" width="200" height="570" rx="10" fill="#e9f3ec" stroke="#2f5d3a" stroke-width="3"/><text x="450.0" y="88" font-size="11" text-anchor="middle" fill="#2f5d3a" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-style="italic">антенна</text><rect x="420" y="640" width="60" height="22" rx="3" fill="#cfd6dd" stroke="#556" stroke-width="2"/><text x="450.0" y="656" font-size="11" text-anchor="middle" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="bold">USB</text><text x="450.0" y="330" font-size="22" text-anchor="middle" fill="#2f5d3a" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="bold">ESP32</text><text x="450.0" y="352" font-size="14" text-anchor="middle" fill="#2f5d3a" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">DevKit</text><circle cx="350" cy="100" r="4" fill="#9aa" stroke="#fff" stroke-width="1"/><text x="364" y="104" font-size="11" text-anchor="start" fill="#888" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">EN</text><circle cx="350" cy="136" r="4" fill="#9aa" stroke="#fff" stroke-width="1"/><text x="364" y="140" font-size="11" text-anchor="start" fill="#888" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">VP (36)</text><circle cx="350" cy="172" r="4" fill="#9aa" stroke="#fff" stroke-width="1"/><text x="364" y="176" font-size="11" text-anchor="start" fill="#888" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">VN (39)</text><circle cx="350" cy="208" r="4" fill="#9aa" stroke="#fff" stroke-width="1"/><text x="364" y="212" font-size="11" text-anchor="start" fill="#888" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">D34</text><circle cx="350" cy="244" r="4" fill="#9aa" stroke="#fff" stroke-width="1"/><text x="364" y="248" font-size="11" text-anchor="start" fill="#888" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">D35</text><circle cx="350" cy="280" r="4" fill="#9aa" stroke="#fff" stroke-width="1"/><text x="364" y="284" font-size="11" text-anchor="start" fill="#888" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">D32</text><circle cx="350" cy="316" r="4" fill="#9aa" stroke="#fff" stroke-width="1"/><text x="364" y="320" font-size="11" text-anchor="start" fill="#888" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">D33</text><circle cx="350" cy="352" r="4" fill="#9aa" stroke="#fff" stroke-width="1"/><text x="364" y="356" font-size="11" text-anchor="start" fill="#888" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">D25</text><circle cx="350" cy="388" r="7" fill="#1e6fd9" stroke="#fff" stroke-width="2"/><text x="364" y="392" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="bold">GPIO26 (D26)</text><circle cx="350" cy="424" r="7" fill="#8e44ad" stroke="#fff" stroke-width="2"/><text x="364" y="428" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="bold">GPIO27 (D27)</text><circle cx="350" cy="460" r="4" fill="#9aa" stroke="#fff" stroke-width="1"/><text x="364" y="464" font-size="11" text-anchor="start" fill="#888" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">D14</text><circle cx="350" cy="496" r="4" fill="#9aa" stroke="#fff" stroke-width="1"/><text x="364" y="500" font-size="11" text-anchor="start" fill="#888" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">D12</text><circle cx="350" cy="532" r="4" fill="#9aa" stroke="#fff" stroke-width="1"/><text x="364" y="536" font-size="11" text-anchor="start" fill="#888" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">D13</text><circle cx="350" cy="568" r="7" fill="#222222" stroke="#fff" stroke-width="2"/><text x="364" y="572" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="bold">GND</text><circle cx="350" cy="604" r="7" fill="#ef8a00" stroke="#fff" stroke-width="2"/><text x="364" y="608" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="bold">VIN (5 В)</text><circle cx="550" cy="100" r="4" fill="#9aa" stroke="#fff" stroke-width="1"/><text x="536" y="104" font-size="11" text-anchor="end" fill="#888" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">D23</text><circle cx="550" cy="136" r="4" fill="#9aa" stroke="#fff" stroke-width="1"/><text x="536" y="140" font-size="11" text-anchor="end" fill="#888" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">D22</text><circle cx="550" cy="172" r="4" fill="#9aa" stroke="#fff" stroke-width="1"/><text x="536" y="176" font-size="11" text-anchor="end" fill="#888" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">TX0</text><circle cx="550" cy="208" r="4" fill="#9aa" stroke="#fff" stroke-width="1"/><text x="536" y="212" font-size="11" text-anchor="end" fill="#888" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">RX0</text><circle cx="550" cy="244" r="4" fill="#9aa" stroke="#fff" stroke-width="1"/><text x="536" y="248" font-size="11" text-anchor="end" fill="#888" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">D21</text><circle cx="550" cy="280" r="4" fill="#9aa" stroke="#fff" stroke-width="1"/><text x="536" y="284" font-size="11" text-anchor="end" fill="#888" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">D19</text><circle cx="550" cy="316" r="4" fill="#9aa" stroke="#fff" stroke-width="1"/><text x="536" y="320" font-size="11" text-anchor="end" fill="#888" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">D18</text><circle cx="550" cy="352" r="4" fill="#9aa" stroke="#fff" stroke-width="1"/><text x="536" y="356" font-size="11" text-anchor="end" fill="#888" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">D5</text><circle cx="550" cy="388" r="4" fill="#9aa" stroke="#fff" stroke-width="1"/><text x="536" y="392" font-size="11" text-anchor="end" fill="#888" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">TX2 (17)</text><circle cx="550" cy="424" r="4" fill="#9aa" stroke="#fff" stroke-width="1"/><text x="536" y="428" font-size="11" text-anchor="end" fill="#888" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">RX2 (16)</text><circle cx="550" cy="460" r="4" fill="#9aa" stroke="#fff" stroke-width="1"/><text x="536" y="464" font-size="11" text-anchor="end" fill="#888" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">D4</text><circle cx="550" cy="496" r="6" fill="#f2c200" stroke="#fff" stroke-width="2"/><text x="536" y="500" font-size="12" text-anchor="end" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="bold">D2 (GPIO2)</text><circle cx="550" cy="532" r="4" fill="#9aa" stroke="#fff" stroke-width="1"/><text x="536" y="536" font-size="11" text-anchor="end" fill="#888" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">D15</text><circle cx="550" cy="568" r="4" fill="#9aa" stroke="#fff" stroke-width="1"/><text x="536" y="572" font-size="11" text-anchor="end" fill="#888" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">GND</text><circle cx="550" cy="604" r="4" fill="#9aa" stroke="#fff" stroke-width="1"/><text x="536" y="608" font-size="11" text-anchor="end" fill="#888" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">3V3</text><rect x="20" y="150" width="190" height="150" rx="8" fill="#f4f6fa" stroke="#445" stroke-width="2"/><text x="115.0" y="172" font-size="14" text-anchor="middle" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="bold">Модуль реле</text><text x="115.0" y="190" font-size="11" text-anchor="middle" fill="#666" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">питание 5 В</text><circle cx="210" cy="195" r="4.5" fill="#fff" stroke="#1e6fd9" stroke-width="2"/><text x="201" y="199" font-size="12" text-anchor="end" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">IN</text><circle cx="210" cy="235" r="4.5" fill="#fff" stroke="#222222" stroke-width="2"/><text x="201" y="239" font-size="12" text-anchor="end" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">GND</text><circle cx="210" cy="275" r="4.5" fill="#fff" stroke="#ef8a00" stroke-width="2"/><text x="201" y="279" font-size="12" text-anchor="end" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">VCC</text><text x="115" y="322" font-size="11" text-anchor="middle" fill="#666" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">контакты COM и NO идут</text><text x="115" y="337" font-size="11" text-anchor="middle" fill="#666" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">к замку (схемы 2 и 3)</text><polyline points="210,195 320,195 320,388 350,388" fill="none" stroke="#1e6fd9" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="210,235 260,235 260,568 350,568" fill="none" stroke="#222222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="210,275 235,275 235,604 350,604" fill="none" stroke="#ef8a00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="20" y="520" width="190" height="120" rx="8" fill="#f4f6fa" stroke="#445" stroke-width="2"/><text x="115.0" y="542" font-size="14" text-anchor="middle" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="bold">Источник 5 В</text><text x="115.0" y="560" font-size="11" text-anchor="middle" fill="#666" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">DC-DC 12 → 5 В</text><circle cx="210" cy="568" r="4.5" fill="#fff" stroke="#222222" stroke-width="2"/><text x="201" y="572" font-size="12" text-anchor="end" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">OUT−</text><circle cx="210" cy="604" r="4.5" fill="#fff" stroke="#ef8a00" stroke-width="2"/><text x="201" y="608" font-size="12" text-anchor="end" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">OUT+</text><text x="115" y="625" font-size="10" text-anchor="middle" fill="#666" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">вход IN — от блока питания замка</text><polyline points="210,568 350,568" fill="none" stroke="#222222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="260" cy="568" r="5" fill="#222222"/><polyline points="210,604 350,604" fill="none" stroke="#ef8a00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="235" cy="604" r="5" fill="#ef8a00"/><polyline points="350,424 335,424" fill="none" stroke="#8e44ad" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="335" cy="424" r="3.5" fill="#8e44ad"/><polyline points="335,424 318,424" fill="none" stroke="#8e44ad" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="318" y1="424" x2="302" y2="412" stroke="#222222" stroke-width="3" stroke-linecap="round"/><circle cx="300" cy="424" r="3.5" fill="#222222"/><polyline points="300,424 290,424 290,438" fill="none" stroke="#222222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="279" y1="438" x2="301" y2="438" stroke="#222222" stroke-width="2.5" stroke-linecap="round"/><line x1="283" y1="443" x2="297" y2="443" stroke="#222222" stroke-width="2.5" stroke-linecap="round"/><line x1="287" y1="448" x2="293" y2="448" stroke="#222222" stroke-width="2.5" stroke-linecap="round"/><text x="314" y="468" font-size="11" text-anchor="middle" fill="#444" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">кнопка</text><text x="314" y="481" font-size="11" text-anchor="middle" fill="#444" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">выхода</text><rect x="600" y="90" width="320" height="205" rx="8" fill="#f1f8f3" stroke="#2f5d3a" stroke-width="2"/><text x="614" y="112" font-size="13" text-anchor="start" fill="#2f5d3a" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="bold">Что к чему</text><text x="614" y="132" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">GPIO26 → IN модуля реле</text><text x="614" y="150" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">GPIO27 → кнопка выхода → GND</text><text x="614" y="168" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">VIN → +5 В (от DC-DC) и VCC реле</text><text x="614" y="186" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">GND → общий минус (реле, DC-DC, кнопка)</text><text x="614" y="204" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif"></text><text x="614" y="222" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Все остальные выводы не используются.</text><text x="614" y="240" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Все GND соединяются вместе.</text><rect x="600" y="315" width="320" height="150" rx="8" fill="#fffbea" stroke="#b58900" stroke-width="2"/><text x="614" y="337" font-size="13" text-anchor="start" fill="#b58900" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="bold">Уже есть на плате</text><text x="614" y="357" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Светодиод платы (D2): мигает в режиме</text><text x="614" y="375" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">добавления телефона, горит при открытии.</text><text x="614" y="393" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Внешних проводов к нему не нужно.</text><text x="614" y="411" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif"></text><text x="614" y="429" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Кнопка BOOT (GPIO0) уже есть на плате.</text><rect x="600" y="485" width="320" height="152" rx="8" fill="#f4f6fa" stroke="#445" stroke-width="2"/><text x="614" y="507" font-size="13" text-anchor="start" fill="#445" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="bold">Важно</text><text x="614" y="527" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">Расположение выводов у разных плат</text><text x="614" y="545" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">отличается. Ориентируйтесь на надписи</text><text x="614" y="563" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">на самой плате: «26», «27», «VIN» (или</text><text x="614" y="581" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">«5V»), «GND». Если плата питается от</text><text x="614" y="599" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">USB во время прошивки, лучше отключите</text><text x="614" y="617" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">5 В от DC-DC: не на всех платах есть защита.</text><polyline points="20,385 48,385" fill="none" stroke="#1e6fd9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="58" y="389" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">GPIO26 → реле</text><polyline points="20,405 48,405" fill="none" stroke="#8e44ad" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="58" y="409" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">GPIO27 → кнопка</text><polyline points="20,425 48,425" fill="none" stroke="#ef8a00" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="58" y="429" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">+5 В</text><polyline points="20,445 48,445" fill="none" stroke="#222222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><text x="58" y="449" font-size="12" text-anchor="start" fill="#222" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">GND</text></svg>